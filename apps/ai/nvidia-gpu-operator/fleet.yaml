defaultNamespace: "gpu-operator"
helm:
  repo: https://helm.ngc.nvidia.com/nvidia
  chart: gpu-operator
  releaseName: gpu-operator
  version: "26.7.2"
  values:
    toolkit:
      env:
      - name: CONTAINERD_SOCKET
        value: /run/k3s/containerd/containerd.sock

overrideTargets:
  - clusterSelector:
      matchLabels:
         has-gpu: "nvidia"
labels:
  provides: nvidia-gpu-operator
