defaultNamespace: cattle-neuvector-system
helm:
  chart: neuvector
  repo: https://charts.rancher.io
  version: "109.0.3+up2.10.3"
  valuesFiles:
    - values.yaml
overrideTargets:
  - clusterSelector:
      matchLabels:
        needs-security: "true"
dependsOn:
  - selector:
      matchLabels:
        provides: neuvector-crd
labels:
  provides: neuvector
