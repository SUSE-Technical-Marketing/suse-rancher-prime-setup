defaultNamespace: cert-manager
helm:
  chart: oci://dp.apps.rancher.io/charts/cert-manager
  releaseName: cert-manager
  values:
    global:
      imagePullSecrets: ["application-collection"]
    crds:
      enabled: true
    dns01RecursiveNameserversOnly: true
    dns01RecursiveNameservers: "8.8.8.8:53,1.1.1.1:53"
    # Its post-install hook (and the ServiceAccount it runs as) doesn't survive Fleet upgrading the
    # release right after installing it: the check then fails, or hangs without a token.
    startupapicheck:
      enabled: false
labels:
  provides: cert-manager
diff:
  comparePatches:
  - apiVersion: admissionregistration.k8s.io/v1
    kind: ValidatingWebhookConfiguration
    name: cert-manager-webhook
    operations:
    - {"op": "remove", "path":"/webhooks/0"}
  - apiVersion: admissionregistration.k8s.io/v1
    kind: MutatingWebhookConfiguration
    name: cert-manager-webhook
    operations:
    - {"op": "remove", "path":"/webhooks/0"}
