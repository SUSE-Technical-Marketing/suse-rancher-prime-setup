# Reference lab 4: Rancher with a metal RKE2 cluster on a physical machine.
apiVersion: lab.geeko.me/v1alpha1
kind: Lab
metadata:
  name: rancher-custom-edge
spec:
  domain: lab.geeko.me

  tls:
    acme: letsencrypt
    email: lab@geeko.me
    cloudflare: "{{ secrets.cloudflare.token }}"

  ssh:
    user: lab
    publicKey: { file: ~/.ssh/id_ed25519.pub }
    privateKey: "{{ secrets['ssh-key'] }}"
---
apiVersion: lab.geeko.me/v1alpha1
kind: Harvester
metadata:
  name: hv-north
  description: url and credentials from the personal config
spec:
  dns:
    backend: routeros
    host: 10.29.100.1
    credentials: "{{ secrets.routeros }}"
---
apiVersion: lab.geeko.me/v1alpha1
kind: HarvesterVM
metadata:
  name: rancher
spec:
  harvester: hv-north
  os: leap-16-k8s
  cpu: 4
  memory: 16Gi
  disk: 100Gi
  profiles:
    k3s: {}
    cert-manager: {}
    sprouter: {}
    traefik: {}
    rancher:
      adminPassword: "{{ secrets['rancher-admin'] }}"
---
apiVersion: lab.geeko.me/v1alpha1
kind: Machine
metadata:
  name: nuc-01
  description: Physical machine with an existing DNS record
spec:
  # physical machine with an existing DNS record
  address: nuc-01.lab.geeko.me
  user: root
  os: sles-16-k8s
---
apiVersion: lab.geeko.me/v1alpha1
kind: DownstreamCluster
metadata:
  name: edge
spec:
  type: metal
  rancher: rancher
  distro: rke2
  labels: { env: edge }
  nodes:
    - host: nuc-01
      roles: [ etcd, controlplane, worker ]
---
apiVersion: lab.geeko.me/v1alpha1
kind: ClusterGroup
metadata:
  name: edge
  description: The downstream clusters labelled for it
spec:
  selector: { matchLabels: { env: edge } }
