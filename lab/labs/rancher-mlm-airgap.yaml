# Reference lab 1: Rancher, Multi-Linux Manager and an air-gap registry, each on its own VM.
apiVersion: lab.geeko.me/v1alpha1
kind: Lab
metadata:
  name: rancher-mlm-airgap
spec:
  domain: lab.geeko.me

  tls:
    acme: letsencrypt
    email: lab@geeko.me
    cloudflare: "{{ secrets['cloudflare-token'] }}"

  ssh:
    user: lab
    publicKey: { file: ~/.ssh/id_ed25519.pub }
    privateKey: "{{ secrets['ssh-key'] }}"
---
apiVersion: lab.geeko.me/v1alpha1
kind: Harvester
metadata:
  name: hv-north
  description: url and credentials from the personal config
spec:
  # url and credentials from the personal config
  dns:
    backend: routeros
    host: 10.29.100.1
    credentials: "{{ secrets.routeros }}"
  networks:
    default: vlan100
    vlans:
      - id: 100
        dhcp: { cidr: 10.29.100.0/24, gateway: 10.29.100.1, range: [ 10.29.100.100, 10.29.100.150 ] }
---
apiVersion: lab.geeko.me/v1alpha1
kind: HarvesterVM
metadata:
  name: rancher
spec:
  harvester: hv-north
  os: leap-16-k8s
  cpu: 4
  memory: 16Gi
  disk: 100Gi
  profiles:
    k3s: {}
    cert-manager: {}
    sprouter: {}
    traefik: {}
    rancher:
      adminPassword: "{{ secrets['rancher-admin'] }}"
      plugins: [ harvester, kubewarden ]
---
apiVersion: lab.geeko.me/v1alpha1
kind: HarvesterVM
metadata:
  name: mlm
spec:
  harvester: hv-north
  os: sl-micro-6.1
  cpu: 4
  memory: 16Gi
  disk: 300Gi
  profiles:
    mlm-server:
      adminPassword: "{{ secrets['mlm-admin'] }}"
---
apiVersion: lab.geeko.me/v1alpha1
kind: HarvesterVM
metadata:
  name: registry
spec:
  harvester: hv-north
  os: leap-16
  cpu: 2
  memory: 4Gi
  disk: 200Gi
  profiles:
    hauler:
      manifests: [ rancher-2.15 ]
