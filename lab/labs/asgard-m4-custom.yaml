# M4 test lab: a custom cluster on existing machines (`Machine`), here the bare VMs of
# labs/asgard-m4-vms.yaml. It uses no Harvester, so it claims none. Rancher runs on machine-01 (k3s
# with its own Traefik and ServiceLB); machine-02 (all roles) and machine-03 (worker) join a custom
# RKE2 cluster and are cleaned up again on destroy.
apiVersion: lab.geeko.me/v1alpha1
kind: Lab
metadata:
  name: asgard-m4-custom
spec:
  domain: lab.geeko.me

  tls:
    # Staging while iterating: Let's Encrypt allows 5 certificates per week for the same names.
    acme: letsencrypt-staging
    email: jeroen@vanerp.info
    cloudflare: "{{ secrets['cloudflare-token'] }}"

  ssh:
    user: lab
    publicKey: { file: ~/.ssh/id_ed25519.pub }
    privateKey: "{{ secrets['ssh-key'] }}"
---
apiVersion: lab.geeko.me/v1alpha1
kind: Machine
metadata:
  name: machine-01
spec:
  address: machine-01.lab.geeko.me
  user: lab
  os: leap-16-k8s
  profiles:
    k3s: {}
    cert-manager: {}
    sprouter: {}
    outrider: {}
    rancher:
      adminPassword: "{{ secrets['rancher-admin'] }}"
---
apiVersion: lab.geeko.me/v1alpha1
kind: Machine
metadata:
  name: machine-02
spec:
  address: machine-02.lab.geeko.me
  user: lab
  os: leap-16-k8s
---
apiVersion: lab.geeko.me/v1alpha1
kind: Machine
metadata:
  name: machine-03
spec:
  address: machine-03.lab.geeko.me
  user: lab
  os: leap-16-k8s
---
apiVersion: lab.geeko.me/v1alpha1
kind: DownstreamCluster
metadata:
  name: edge
spec:
  type: custom
  rancher: machine-01
  distro: rke2
  labels: { env: edge }
  nodes:
    - host: machine-02
      roles: [ etcd, controlplane, worker ]
    - host: machine-03
      roles: [ worker ]
