# Reference lab 2: Rancher provisions an RKE2 cluster on Harvester and labels it for Fleet.
apiVersion: lab.geeko.me/v1alpha1
kind: Lab
metadata:
  name: rancher-harvester-rke2
spec:
  domain: lab.geeko.me

  tls:
    acme: letsencrypt
    email: lab@geeko.me
    cloudflare: "{{ secrets.cloudflare.token }}"

  ssh:
    user: lab
    publicKey: { file: ~/.ssh/id_ed25519.pub }
    privateKey: "{{ secrets['ssh-key'] }}"
---
apiVersion: lab.geeko.me/v1alpha1
kind: Harvester
metadata:
  name: hv-north
  description: url and credentials from the personal config
spec:
  dns:
    backend: routeros
    host: 10.29.100.1
    credentials: "{{ secrets.routeros }}"
  networks:
    default: vlan100
    vlans:
      - id: 100
        dhcp: { cidr: 10.29.100.0/24, gateway: 10.29.100.1, range: [ 10.29.100.100, 10.29.100.150 ] }
---
apiVersion: lab.geeko.me/v1alpha1
kind: HarvesterVM
metadata:
  name: rancher
spec:
  harvester: hv-north
  os: leap-16
  cpu: 4
  memory: 16Gi
  disk: 100Gi
  profiles:
    k3s: {}
    cert-manager: {}
    sprouter: {}
    traefik: {}
    rancher:
      adminPassword: "{{ secrets['rancher-admin'] }}"
---
apiVersion: lab.geeko.me/v1alpha1
kind: DownstreamCluster
metadata:
  name: apps
spec:
  type: harvester
  rancher: rancher
  harvester: hv-north
  distro: rke2
  labels: { env: demo }
  pools:
    - name: all
      quantity: 3
      roles: [ etcd, controlplane, worker ]
      cpu: 4
      memory: 8Gi
      disk: 60Gi
      os: sles-16
---
apiVersion: lab.geeko.me/v1alpha1
kind: ClusterGroup
metadata:
  name: demo
  description: The downstream clusters labelled for it
spec:
  selector: { matchLabels: { env: demo } }
