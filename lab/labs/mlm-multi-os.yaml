# Reference lab 3: Multi-Linux Manager managing several Linux distributions.
apiVersion: lab.geeko.me/v1alpha1
kind: Lab
metadata:
  name: mlm-multi-os
spec:
  domain: lab.geeko.me

  tls:
    acme: letsencrypt
    email: lab@geeko.me
    cloudflare: "{{ secrets.cloudflare.token }}"

  ssh:
    user: lab
    publicKey: { file: ~/.ssh/id_ed25519.pub }
    privateKey: "{{ secrets['ssh-key'] }}"
---
apiVersion: lab.geeko.me/v1alpha1
kind: Harvester
metadata:
  name: hv-north
  description: url and credentials from the personal config
spec:
  dns:
    backend: routeros
    host: 10.29.100.1
    credentials: "{{ secrets.routeros }}"
  networks:
    default: vlan100
    vlans:
      - id: 100
        dhcp: { cidr: 10.29.100.0/24, gateway: 10.29.100.1, range: [ 10.29.100.100, 10.29.100.150 ] }
---
apiVersion: lab.geeko.me/v1alpha1
kind: HarvesterVM
metadata:
  name: mlm
spec:
  harvester: hv-north
  os: sl-micro-6.1
  cpu: 4
  memory: 16Gi
  disk: 400Gi
  profiles:
    mlm-server:
      adminPassword: "{{ secrets['mlm-admin'] }}"
---
apiVersion: lab.geeko.me/v1alpha1
kind: HarvesterVM
metadata:
  name: sles-01
spec:
  harvester: hv-north
  os: sles-16
  cpu: 2
  memory: 4Gi
  disk: 40Gi
  profiles:
    mlm-client: { server: mlm }
---
apiVersion: lab.geeko.me/v1alpha1
kind: HarvesterVM
metadata:
  name: ubuntu-01
spec:
  harvester: hv-north
  os: ubuntu-24.04
  cpu: 2
  memory: 4Gi
  disk: 40Gi
  profiles:
    mlm-client: { server: mlm }
---
apiVersion: lab.geeko.me/v1alpha1
kind: HarvesterVM
metadata:
  name: rocky-01
spec:
  harvester: hv-north
  os: rocky-9
  cpu: 2
  memory: 4Gi
  disk: 40Gi
  profiles:
    mlm-client: { server: mlm }
---
apiVersion: lab.geeko.me/v1alpha1
kind: HarvesterVM
metadata:
  name: leap-01
spec:
  harvester: hv-north
  os: leap-16
  cpu: 2
  memory: 4Gi
  disk: 40Gi
  profiles:
    mlm-client: { server: mlm }
