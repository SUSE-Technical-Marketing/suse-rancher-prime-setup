# M4 test lab: Rancher on one VM on asgard (as asgard-m3), and a custom RKE2 cluster on a second VM
# that stands in for an existing machine. Harvester url and credentials come from the personal config.
apiVersion: lab.geeko.me/v1alpha1
kind: Lab
metadata:
  name: asgard-m4
spec:
  domain: lab.geeko.me

  tls:
    # Staging while iterating: Let's Encrypt allows 5 certificates per week for the same names.
    acme: letsencrypt-staging
    email: jeroen@vanerp.info
    cloudflare: "{{ secrets['cloudflare-token'] }}"

  ssh:
    user: lab
    publicKey: { file: ~/.ssh/id_ed25519.pub }
    privateKey: "{{ secrets['ssh-key'] }}"

  # Inputs for the catalog's secrets (Fleet's Helm logins and values files); add once appco / scc /
  # suse-observability-license are in the personal config:
  # inputs:
  #   appco: "{{ secrets.appco }}"
  #   scc: "{{ secrets.scc }}"
  #   suse-observability-license: "{{ secrets['suse-observability-license'] }}"
---
apiVersion: lab.geeko.me/v1alpha1
kind: Harvester
metadata:
  name: asgard
spec:
  dns:
    backend: routeros
    host: 10.29.20.1
    credentials: "{{ secrets.routeros }}"
  networks:
    default: vlan20
    vlans:
      - id: 20
        dhcp: { cidr: 10.29.20.0/24, gateway: 10.29.20.1, range: [ 10.29.20.100, 10.29.20.150 ] }
        loadBalancer: { range: [ 10.29.20.200, 10.29.20.220 ] } # Harvester LB pool for guest clusters
---
apiVersion: lab.geeko.me/v1alpha1
kind: HarvesterVM
metadata:
  name: rancher
spec:
  harvester: asgard
  os: leap-16-k8s
  cpu: 4
  memory: 16Gi
  disk: 100Gi
  profiles:
    k3s: {}
    harvester-cloud-provider: {}
    cert-manager: {}
    sprouter: {}
    traefik: {}
    outrider: {}
    rancher:
      adminPassword: "{{ secrets['rancher-admin'] }}"
---
apiVersion: lab.geeko.me/v1alpha1
kind: HarvesterVM
metadata:
  name: edge-01
  description: A plain VM that joins the custom cluster, like an existing machine would
spec:
  harvester: asgard
  os: leap-16-k8s
  cpu: 4
  memory: 8Gi
  disk: 60Gi
---
apiVersion: lab.geeko.me/v1alpha1
kind: DownstreamCluster
metadata:
  name: edge
spec:
  type: custom
  rancher: rancher
  distro: rke2
  labels: { env: edge }
  nodes:
    - host: edge-01
      roles: [ etcd, controlplane, worker ]
