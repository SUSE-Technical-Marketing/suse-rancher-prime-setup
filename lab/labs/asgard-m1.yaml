# M1 test lab: one plain VM on asgard, VLAN 20, with DHCP and DNS from the lab.
# Harvester url and credentials come from the personal config (harvesters.asgard).
apiVersion: lab.geeko.me/v1alpha1
kind: Lab
metadata:
  name: asgard-m1
spec:
  domain: lab.geeko.me

  tls:
    acme: letsencrypt
    email: jeroen@vanerp.info
    cloudflare: "{{ secrets['cloudflare-token'] }}"

  ssh:
    user: lab
    publicKey: { file: ~/.ssh/id_ed25519.pub }
    privateKey: "{{ secrets['ssh-key'] }}"
---
apiVersion: lab.geeko.me/v1alpha1
kind: Harvester
metadata:
  name: asgard
spec:
  dns:
    backend: routeros
    host: 10.29.20.1
    credentials: "{{ secrets.routeros }}"
  networks:
    default: vlan20
    vlans:
      - id: 20
        dhcp: { cidr: 10.29.20.0/24, gateway: 10.29.20.1, range: [ 10.29.20.100, 10.29.20.150 ] }
---
apiVersion: lab.geeko.me/v1alpha1
kind: HarvesterVM
metadata:
  name: m1-test
spec:
  harvester: asgard
  os: leap-16
  cpu: 2
  memory: 4Gi
  disk: 30Gi
