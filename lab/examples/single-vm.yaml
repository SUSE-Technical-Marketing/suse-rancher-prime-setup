# One plain VM on a Harvester, with DHCP and DNS from the lab.
# Copy it, then change the domain, the email, the Harvester and its network to yours.
# The Harvester's url and credentials come from your personal config (harvesters.my-harvester).
apiVersion: lab.geeko.me/v1alpha1
kind: Lab
metadata:
  name: single-vm
spec:
  domain: example.com

  tls:
    acme: letsencrypt
    email: you@example.com
    cloudflare: "{{ secrets.cloudflare.token }}"

  ssh:
    user: lab
    publicKey: { file: ~/.ssh/id_ed25519.pub }
    privateKey: "{{ secrets['ssh-key'] }}"
---
apiVersion: lab.geeko.me/v1alpha1
kind: Harvester
metadata:
  name: my-harvester
spec:
  profiles:
    harvester-dns-controller:
      backend: routeros
      host: 192.168.20.1
      credentials: "{{ secrets.routeros }}"
  networks:
    default: vlan20
    vlans:
      - id: 20
        dhcp: { cidr: 192.168.20.0/24, gateway: 192.168.20.1, range: [ 192.168.20.100, 192.168.20.150 ] }
---
apiVersion: lab.geeko.me/v1alpha1
kind: HarvesterVM
metadata:
  name: web
spec:
  harvester: my-harvester
  os: leap-16
  cpu: 2
  memory: 4Gi
  disk: 30Gi
