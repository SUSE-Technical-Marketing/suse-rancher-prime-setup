# Rancher on a VM, with an RKE2 cluster of three Harvester VMs it provisions.
# Copy it, then change the domain, the email, the Harvester and its network to yours.
# The Harvester's url and credentials come from your personal config (harvesters.my-harvester).
apiVersion: lab.geeko.me/v1alpha1
kind: Lab
metadata:
  name: rancher-rke2
spec:
  domain: example.com

  tls:
    acme: letsencrypt
    email: you@example.com
    cloudflare: "{{ secrets.cloudflare.token }}"

  ssh:
    user: lab
    publicKey: { file: ~/.ssh/id_ed25519.pub }
    privateKey: "{{ secrets['ssh-key'] }}"
---
apiVersion: lab.geeko.me/v1alpha1
kind: Harvester
metadata:
  name: my-harvester
spec:
  profiles:
    harvester-dns-controller:
      backend: routeros
      host: 192.168.100.1
      credentials: "{{ secrets.routeros }}"
  networks:
    default: vlan100
    vlans:
      - id: 100
        dhcp: { cidr: 192.168.100.0/24, gateway: 192.168.100.1, range: [ 192.168.100.100, 192.168.100.150 ] }
---
apiVersion: lab.geeko.me/v1alpha1
kind: HarvesterVM
metadata:
  name: rancher
spec:
  harvester: my-harvester
  os: leap-16
  cpu: 4
  memory: 16Gi
  disk: 100Gi
  profiles:
    k3s: {}
    cert-manager: {}
    sprouter: {}
    traefik: {}
    rancher:
      adminPassword: "{{ secrets['rancher-admin'] }}"
---
apiVersion: lab.geeko.me/v1alpha1
kind: DownstreamCluster
metadata:
  name: apps
spec:
  type: harvester
  rancher: rancher
  harvester: my-harvester
  distro: rke2
  labels: { env: demo }
  pools:
    - name: all
      quantity: 3
      roles: [ etcd, controlplane, worker ]
      cpu: 4
      memory: 8Gi
      disk: 60Gi
      os: sles-16
---
apiVersion: lab.geeko.me/v1alpha1
kind: ClusterGroup
metadata:
  name: demo
  description: The downstream clusters labelled for it
spec:
  selector: { matchLabels: { env: demo } }
