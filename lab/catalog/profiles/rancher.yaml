apiVersion: lab.geeko.me/v1alpha1
kind: Profile
metadata:
  name: rancher
  description: Rancher Manager on the host's Kubernetes cluster, with UI plugins and Fleet
spec:
  icon: tractor                # in the lab UI (lucide.dev/icons)
  charts:
    - chart: rancher
      namespace: cattle-system
      values:
        global: { cattle: { psp: { enabled: false } } }
      # Rancher is single-node, and wired to the host's ingress, certificate and (staging) CA.
      lockedValues:
        replicas: 1
        hostname: "{{ settings.hostname }}.{{ host.fqdn }}"
        # The exposure setting: a Gateway on the host's GatewayClass and HTTPRoutes, or an Ingress;
        # auto picks the Gateway API when the host has it.
        networkExposure:
          type: "{{ settings.exposure if settings.exposure != 'auto' else ('gateway' if outputs['gateway-api'] else 'ingress') }}"
        gateway:
          gatewayClass:
            name: "{{ outputs['gateway-api'].gatewayClassName if outputs['gateway-api'] else '' }}"
            tls: { source: secret, secretName: "{{ outputs.tls.secretName }}" }
        # Its tls.source also decides how Rancher treats its CA, in either mode.
        ingress:
          ingressClassName: "{{ outputs.ingress.ingressClassName }}"
          tls: { source: secret, secretName: "{{ outputs.tls.secretName }}" }
        # Agents trust a certificate from an untrusted CA (Let's Encrypt staging) only through its roots, as a private CA.
        privateCA: "{{ lab.tls.privateCA }}"
        agentTLSMode: "{{ 'strict' if lab.tls.privateCA else 'system-store' }}"
    # Liz, Rancher's AI assistant: the agent (its UI is the rancher-ai-ui plugin).
    - chart: rancher-ai-agent
      namespace: cattle-ai-agent-system
      when: "{{ settings.liz | default(false) }}"
  requires: [ kubernetes, ingress, tls, secret-propagation ]
  # A SecretTemplate for Fleet can require Outrider; build it first. The Gateway API when exposed on it.
  uses: [ downstream-secrets, gateway-api ]
  requiresWhen:
    - { field: exposure, equals: gateway, capability: gateway-api }
  secretFields: [ adminPassword ]
  settings:
    type: object
    required: [ adminPassword ]
    properties:
      version: { type: string }
      hostname:
        $ref: dnsLabel
        default: rancher
        description: "First label of Rancher's name: <hostname>.<host>.<domain>"
      adminPassword: { $ref: secretOrString }
      exposure:
        enum: [ auto, gateway, ingress ]
        default: auto
        description: "How Rancher is reached: gateway (a Gateway and HTTPRoutes), ingress (an Ingress), or auto: gateway when the host has the Gateway API"
      plugins:
        description: UI plugins by name (versions from the catalog), or name -> version; default the catalog's set
        anyOf:
          - type: array
            items: { type: string, minLength: 1 }
          - type: object
            additionalProperties: { type: string, minLength: 1 }
      liz:
        type: boolean
        description: Install Liz, Rancher's AI assistant
      values:
        $ref: chartValues
        description: Extra Helm values, merged over the engine's
      settings:
        type: object
        description: "Rancher settings by name (management.cattle.io Settings), e.g. ui-banners; server-url is the lab's"
        additionalProperties: { type: string }
      features:
        type: object
        description: Feature flags by name, merged over the default; false turns one off
        additionalProperties: { type: boolean }
        default:
          # Harvester's bare-metal container workloads, shown in Virtualization Management.
          harvester-baremetal-container-workload: true
      fleet:
        description: GitRepos and HelmOps from the catalog; their secrets come from the lab's inputs
        type: object
        properties:
          repos:
            type: array
            items: { $ref: dnsLabel }
            description: "GitRepos by catalog name; default the repos with default: true"
          helmOps:
            type: array
            items: { $ref: dnsLabel }
            description: "HelmOps by catalog name; default the HelmOps with default: true"
