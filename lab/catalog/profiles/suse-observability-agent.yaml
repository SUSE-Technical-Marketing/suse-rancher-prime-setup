apiVersion: lab.geeko.me/v1alpha1
kind: Profile
metadata:
  name: suse-observability-agent
  description: SUSE Observability's agent, registered with the instance on another cluster of the lab
spec:
  icon: radar                # in the lab UI (lucide.dev/icons)
  # On a lab host's cluster, a downstream cluster, or a Harvester itself (as an add-on).
  targets: [ host, cluster, harvester ]
  # The engine registers it with its observer (a token of its own), then installs the chart with
  # these values: where to report, as which cluster, its token from the Secret it creates. Values
  # for some targets only are overlays: on a Harvester, its OpenTelemetry integrations.
  charts:
    - chart: suse-observability-agent
      namespace: suse-observability-agent
      lockedValues:
        stackstate:
          url: "{{ refs.observer.outputs['suse-observability'].url }}/receiver/stsAgent"
          cluster: { name: "{{ settings.clusterName or target.name }}" }
        global: { apiKey: { fromSecret: suse-observability-agent-key } }
      values:
        # RKE2's and k3s's kubelets serve self-signed certificates.
        nodeAgent: { skipKubeletTLSVerify: true }
      valueOverlays:
        # SUSE Virtualization's metrics, and Rancher's agent when the Harvester is imported into Rancher.
        - when: "{{ target.kind == 'harvester' }}"
          lockedValues:
            otel: { enabled: true, integrations: { suseVirtualization: true, rancherAgent: "{{ target.imported }}" } }
  requires: [ kubernetes ]
  # The observer: a downstream cluster that runs SUSE Observability (the observability Fleet profile).
  clusterRefs:
    - { field: observer, provides: suse-observability }
  settings:
    type: object
    required: [ observer ]
    properties:
      # The downstream cluster whose SUSE Observability this agent reports to.
      observer:
        type: dnsLabel
        description: the downstream cluster running SUSE Observability that this agent reports to
      # A service token of the instance with admin rights: its bootstrap token (fleet-secrets'
      # suse-observability-token input; give both the same secret). The engine creates the agent's
      # own token with it.
      adminToken:
        type: secret
        default: "{{ secrets.observability.token }}"
        description: the instance's bootstrap service token (not the admin password), to register the agent with
      # Its name in SUSE Observability; default the host's, cluster's or Harvester's name.
      clusterName:
        type: dnsLabel
        description: "its name in SUSE Observability; default: the host's, cluster's or Harvester's name"
      version: { type: string }
      values: { type: chartValues }
