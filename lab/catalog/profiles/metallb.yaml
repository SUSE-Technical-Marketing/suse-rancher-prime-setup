apiVersion: lab.geeko.me/v1alpha1
kind: ChartProfile
metadata:
  name: metallb
  description: "MetalLB in L2 mode: LoadBalancer services get an address from a range on the host's network (instead of ServiceLB)"
spec:
  icon: network                # in the lab UI (lucide.dev/icons)
  charts:
    - chart: metallb
      namespace: metallb-system
      # L2 only: no BGP stack (the chart's frr-k8s backend).
      values: { frrk8s: { enabled: false } }
  # One pool of the settings' addresses, announced over L2: the node answers ARP for them. Names
  # (state) as when this profile was code, so a running lab keeps them.
  objects:
    - name: pool
      # The controller's webhook validates it, and can be Ready before the API server reaches it.
      admitted: true
      object:
        apiVersion: metallb.io/v1beta1
        kind: IPAddressPool
        metadata: { name: lab, namespace: metallb-system }
        spec: { addresses: "{{ settings.addresses }}" }
    - name: l2
      object:
        apiVersion: metallb.io/v1beta1
        kind: L2Advertisement
        metadata: { name: lab, namespace: metallb-system }
        spec: { ipAddressPools: [ lab ] }
  aliases: [ lab:apps:MetalLb ]
  requires: [ kubernetes ]
  provides: [ load-balancer ]
  conflicts: [ load-balancer ]
  settings:
    type: object
    required: [ addresses ]
    properties:
      addresses:
        type: array
        description: Ranges or CIDRs it hands out, on the host's network and outside its DHCP range, e.g. 10.29.20.221-10.29.20.230
        items: { type: string, pattern: '^\d+\.\d+\.\d+\.\d+(/\d+|-\d+\.\d+\.\d+\.\d+)$' }
      version: { type: string }
      values: { $ref: chartValues }
