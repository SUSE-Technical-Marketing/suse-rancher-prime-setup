apiVersion: lab.geeko.me/v1alpha1
kind: SecretTemplate
metadata:
  name: fleet-secrets
  description: Values files for the charts in apps/, copied to kube-system on every downstream cluster by Outrider. Each values file is included when its inputs are given.
spec:
  requires: [ downstream-secrets ]
  inputs:
    appco: credentials
    scc: credentials
    suse-observability-license: string
  template:
    metadata:
      annotations:
        outrider.geeko.me/enabled: "true"
        outrider.geeko.me/namespace: kube-system
    data:
      appco-values.yaml:
        username: { $input: appco.username }
        token: { $input: appco.password }
      harbor-values.yaml:
        registry:
          credential:
            access_key: { $input: appco.username }
            access_secret: { $input: appco.password }
      suse-registry-values.yaml:
        username: { $input: scc.username }
        token: { $input: scc.password }
      cert-manager-values.yaml:
        letsencrypt:
          prod:
            email: { $lab: tls.email }
        cloudflare:
          token: { $lab: tls.cloudflare }
      suse-observability-values.yaml:
        global:
          suseObservability:
            license: { $input: suse-observability-license }
