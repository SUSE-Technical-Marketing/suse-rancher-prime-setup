apiVersion: lab.geeko.me/v1alpha1
kind: SecretTemplate
metadata:
  name: fleet-secrets
  description: Values files for the charts in apps/, copied to kube-system on every downstream cluster by Outrider. Each values file is included when its inputs are given.
spec:
  requires: [ downstream-secrets ]
  inputs:
    appco: credentials
    scc: credentials
    suse-observability-license: string
  template:
    metadata:
      annotations:
        outrider.geeko.me/enabled: "true"
        outrider.geeko.me/namespace: kube-system
    data:
      appco-values.yaml:
        username: "{{ inputs.appco.username }}"
        token: "{{ inputs.appco.password }}"
      harbor-values.yaml:
        registry:
          credential:
            access_key: "{{ inputs.appco.username }}"
            access_secret: "{{ inputs.appco.password }}"
      suse-registry-values.yaml:
        username: "{{ inputs.scc.username }}"
        token: "{{ inputs.scc.password }}"
      cert-manager-values.yaml:
        letsencrypt:
          prod:
            email: "{{ lab.tls.email }}"
        cloudflare:
          token: "{{ lab.tls.cloudflare }}"
      suse-observability-values.yaml:
        global:
          suseObservability:
            license: "{{ inputs['suse-observability-license'] }}"
