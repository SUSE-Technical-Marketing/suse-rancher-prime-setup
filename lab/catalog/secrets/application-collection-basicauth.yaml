apiVersion: lab.geeko.me/v1alpha1
kind: SecretTemplate
metadata:
  name: application-collection-basicauth
  description: Helm login for SUSE Application Collection (oci://dp.apps.rancher.io)
spec:
  inputs: { appco: credentials }
  template:
    type: kubernetes.io/basic-auth
    data:
      username: "{{ inputs.appco.username }}"
      password: "{{ inputs.appco.password }}"
