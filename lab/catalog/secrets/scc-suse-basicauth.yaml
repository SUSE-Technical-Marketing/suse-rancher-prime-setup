apiVersion: lab.geeko.me/v1alpha1
kind: SecretTemplate
metadata:
  name: scc-suse-basicauth
  description: Helm login for the SUSE registry (oci://registry.suse.com), with SCC credentials
spec:
  inputs: { scc: credentials }
  template:
    type: kubernetes.io/basic-auth
    data:
      username: { $input: scc.username }
      password: { $input: scc.password }
