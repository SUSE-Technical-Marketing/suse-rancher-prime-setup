apiVersion: lab.geeko.me/v1alpha1
kind: OperatingSystem
metadata:
  name: leap-16
  description: openSUSE Leap 16.0
spec:
  family: suse
  image:
    url: https://download.opensuse.org/distribution/leap/16.0/appliances/Leap-16.0-Minimal-VM.x86_64-Cloud.qcow2
  cloudInit:
    package_update: true
    packages: [ curl, git-core, bash-completion, vim, wget, tree, qemu-guest-agent, firewalld ]
    runcmd:
      - systemctl enable --now qemu-guest-agent
      # Running from the first boot, not only after a reboot.
      - systemctl enable --now firewalld
