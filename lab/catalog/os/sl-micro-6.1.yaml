apiVersion: lab.geeko.me/v1alpha1
kind: OperatingSystem
metadata:
  name: sl-micro-6.1
  description: SUSE Linux Micro 6.1
spec:
  family: suse
  image: { url: null }
  cloudInit:
    # Register first: bootcmd runs before cloud-init installs packages, which an unregistered
    # system can't. cloud-init-per once: on the first boot only.
    bootcmd:
      - cloud-init-per once register suseconnect --regcode '{{ secrets["scc-regcode-slmicro"] }}'
  # On Harvester VMs only: the guest agent reports the VM's address and lets Harvester shut it down.
  harvester:
    cloudInit:
      packages: [ qemu-guest-agent ]
      runcmd:
        - systemctl enable --now qemu-guest-agent
  # The landlock profile: put lsm=$lsm (landlock first, then the active LSMs) on the kernel command
  # line, in a new snapshot (the root file system is read-only); the engine reboots into it.
  # Not tried yet: SL Micro has no public image.
  landlock:
    enable: |
      transactional-update --non-interactive run sed -i -E "/^GRUB_CMDLINE_LINUX_DEFAULT=/{s/lsm=[^ \"]* ?//;s/^GRUB_CMDLINE_LINUX_DEFAULT=\"/&lsm=$lsm /}" /etc/default/grub
      transactional-update --non-interactive --continue grub.cfg
