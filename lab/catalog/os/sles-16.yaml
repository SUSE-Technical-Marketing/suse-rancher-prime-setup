apiVersion: lab.geeko.me/v1alpha1
kind: OperatingSystem
metadata:
  name: sles-16
  description: SUSE Linux Enterprise Server 16.0
spec:
  family: suse
  image: { url: null }
  registration:
    suseconnect:
      regcode: { $secret: scc-regcode-sles }
  packages: [ curl, git-core, bash-completion, vim, wget, qemu-guest-agent, firewalld ]
  k8s:
    packages: [ k3s-selinux ]
