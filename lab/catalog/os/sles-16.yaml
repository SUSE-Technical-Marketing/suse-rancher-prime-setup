apiVersion: lab.geeko.me/v1alpha1
kind: OperatingSystem
metadata:
  name: sles-16
  description: SUSE Linux Enterprise Server 16.0
spec:
  family: suse
  image: { url: null }
  # On AWS: SUSE's bring-your-own-subscription images, registered with the regcode below.
  ami: { owner: "013907871322", name: "suse-sles-16-0-byos-v*-x86_64", user: ec2-user }
  cloudInit:
    # Register first: bootcmd runs before cloud-init installs packages, which an unregistered
    # system can't. cloud-init-per once: on the first boot only.
    bootcmd:
      - cloud-init-per once register suseconnect --regcode '{{ secrets["scc-regcode-sles"] }}'
    package_update: true
    packages: [ curl, git-core, bash-completion, vim, wget, firewalld ]
    runcmd:
      # Running from the first boot, not only after a reboot.
      - systemctl enable --now firewalld
  # On Harvester VMs only: the guest agent reports the VM's address and lets Harvester shut it down.
  harvester:
    cloudInit:
      packages: [ qemu-guest-agent ]
      runcmd:
        - systemctl enable --now qemu-guest-agent
  # For k3s / RKE2 nodes: what Longhorn needs on every node. iSCSI for its volumes, NFS for RWX
  # volumes, cryptsetup for encrypted ones.
  kubernetes:
    cloudInit:
      # iptables-backend-nft: SUSE 16 ships nftables only, but the CNI's portmap plugin (RKE2's Calico)
      # runs the iptables command for pods with host ports (RKE2's own Traefik). The nft backend, so its
      # rules land in nftables (on 16 that's the iptables package itself, by this capability).
      packages: [ k3s-selinux, open-iscsi, nfs-client, cryptsetup, iptables-backend-nft ]
      runcmd:
        # Minimal images (Leap 16 Minimal-VM) ship kernel-default-base, which has no iscsi_tcp: swap it
        # for the kernel-default of the same version, so the running kernel finds the module without a
        # reboot. kernel-default-base's release is kernel-default's plus three parts (160000.39.1 + .160000.2.28).
        - |
          if rpm -q kernel-default-base >/dev/null 2>&1; then
            r=$(rpm -q --qf '%{VERSION}-%{RELEASE}' kernel-default-base)
            zypper --non-interactive install --no-recommends --oldpackage "kernel-default = ${r%.*.*.*}" -kernel-default-base \
              || echo "kernel-default ${r%.*.*.*} not available: Longhorn needs iscsi_tcp" >&2
          fi
        - systemctl enable --now iscsid
        # No firewalld on Kubernetes nodes, as the k3s and RKE2 docs advise: it conflicts with their
        # CNIs, and would block the API and ingress. Lab VMs sit on lab VLANs.
        - systemctl disable --now firewalld 2>/dev/null || true
  # The landlock profile: put lsm=$lsm (landlock first, then the active LSMs) on the kernel command
  # line, for the bootloader /etc/sysconfig/bootloader names; the engine reboots after it. (Leap 16's
  # image has Landlock active already: then this doesn't run.)
  landlock:
    enable: |
      . /etc/sysconfig/bootloader
      case "$LOADER_TYPE" in
        grub2|grub2-efi)
          sed -i -E '/^GRUB_CMDLINE_LINUX_DEFAULT=/{s/lsm=[^ "]* ?//;s/^GRUB_CMDLINE_LINUX_DEFAULT="/&lsm='"$lsm"' /}' /etc/default/grub
          update-bootloader --refresh ;;
        systemd-boot|grub2-bls)
          sed -i -E -e 's/ ?lsm=[^ ]*//' -e "1s/\$/ lsm=$lsm/" /etc/kernel/cmdline
          sdbootutil update-all-entries ;;
        *) echo "LOADER_TYPE \"$LOADER_TYPE\" in /etc/sysconfig/bootloader: no way to set lsm= for it" >&2; exit 1 ;;
      esac
