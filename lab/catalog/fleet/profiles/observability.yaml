apiVersion: lab.geeko.me/v1alpha1
kind: FleetProfile
metadata:
  name: observability
  description: "SUSE Observability (a Fleet HelmOp), its volumes on the longhorn-single storage class"
spec:
  icon: activity
  labels:
    needs-observability: "true"
  annotations:
    hosted-domain: "{{ lab.domain }}"
  requires: [ storage ]
  provides: [ suse-observability ]
  # Where the HelmOp's ingress puts it (observability.<cluster>.<hosted-domain>): agents report to it,
  # and the engine registers them through its API.
  outputs:
    suse-observability:
      url: "https://observability.{{ cluster.name }}.{{ lab.domain }}"
      # Its OTLP gRPC endpoint (TLS, through its ingress), for OpenTelemetry collectors on other clusters.
      otlp: "otlp-observability.{{ cluster.name }}.{{ lab.domain }}:443"
