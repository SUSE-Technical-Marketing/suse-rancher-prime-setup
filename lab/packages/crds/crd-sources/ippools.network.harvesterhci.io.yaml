apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ippools.network.harvesterhci.io
spec:
  group: network.harvesterhci.io
  names:
    plural: ippools
    singular: ippool
    shortNames:
      - ippl
      - ippls
    kind: IPPool
    listKind: IPPoolList
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - networkName
              properties:
                ipv4Config:
                  type: object
                  required:
                    - cidr
                    - pool
                    - serverIP
                  properties:
                    cidr:
                      type: string
                      x-kubernetes-validations:
                        - rule: self == oldSelf
                          message: CIDR is immutable
                    dns:
                      type: array
                      format: ipv4
                      maxItems: 3
                      items:
                        type: string
                    domainName:
                      type: string
                    domainSearch:
                      type: array
                      items:
                        type: string
                    leaseTime:
                      type: integer
                    ntp:
                      type: array
                      maxItems: 4
                      items:
                        type: string
                    pool:
                      type: object
                      required:
                        - end
                        - start
                      properties:
                        end:
                          type: string
                          format: ipv4
                          x-kubernetes-validations:
                            - rule: self == oldSelf
                              message: End is immutable
                        exclude:
                          type: array
                          format: ipv4
                          items:
                            type: string
                          x-kubernetes-validations:
                            - rule: self == oldSelf
                              message: Exclude is immutable
                        start:
                          type: string
                          format: ipv4
                          x-kubernetes-validations:
                            - rule: self == oldSelf
                              message: Start is immutable
                      x-kubernetes-validations:
                        - rule: "!has(oldSelf.exclude) || has(self.exclude)"
                          message: End is required once set
                    router:
                      type: string
                      format: ipv4
                      x-kubernetes-validations:
                        - rule: self == oldSelf
                          message: Router is immutable
                    serverIP:
                      type: string
                      format: ipv4
                      x-kubernetes-validations:
                        - rule: self == oldSelf
                          message: ServerIP is immutable
                  x-kubernetes-validations:
                    - rule: "!has(oldSelf.router) || has(self.router)"
                      message: Router is required once set
                networkName:
                  type: string
                  maxLength: 64
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: NetworkName is immutable
                paused:
                  type: boolean
            status:
              type: object
              properties:
                agentPodRef:
                  type: object
                  properties:
                    image:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                    uid:
                      description: |-
                        UID is a type that holds unique ID values, including UUIDs.  Because we
                        don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                        intent and helps make sure that UIDs and names do not get conflated.
                      type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - status
                      - type
                    properties:
                      lastTransitionTime:
                        description: Last time the condition transitioned from one status to another.
                        type: string
                      lastUpdateTime:
                        description: The last time this condition was updated.
                        type: string
                      message:
                        description: Human-readable message indicating details about last transition
                        type: string
                      reason:
                        description: The reason for the condition's last transition.
                        type: string
                      status:
                        description: Status of the condition, one of True, False, Unknown.
                        type: string
                      type:
                        description: Type of cluster condition.
                        type: string
                ipv4:
                  type: object
                  required:
                    - available
                    - used
                  properties:
                    allocated:
                      type: object
                      additionalProperties:
                        type: string
                    available:
                      type: integer
                    used:
                      type: integer
                lastUpdate:
                  type: string
                  format: date-time
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: NETWORK
          type: string
          jsonPath: .spec.networkName
        - name: AVAILABLE
          type: integer
          jsonPath: .status.ipv4.available
        - name: USED
          type: integer
          jsonPath: .status.ipv4.used
        - name: REGISTERED
          type: string
          jsonPath: .status.conditions[?(@.type=='Registered')].status
        - name: CACHEREADY
          type: string
          jsonPath: .status.conditions[?(@.type=='CacheReady')].status
        - name: AGENTREADY
          type: string
          jsonPath: .status.conditions[?(@.type=='AgentReady')].status
        - name: AGE
          type: date
          jsonPath: .metadata.creationTimestamp
  conversion:
    strategy: None
